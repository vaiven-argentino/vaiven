# Corre el pipeline (SPEC 5.1). Lo dispara a diario el Cron Trigger del Worker (workflow_dispatch);
# el schedule semanal es el respaldo y además controla que el disparo diario esté llegando.
name: Actualizar datos

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Series separadas por comas (vacío: todas)"
        required: false
        default: ""
  schedule:
    - cron: "41 22 * * 0"   # domingos, 19:41 en Argentina

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

env:
  RESPONSABLE: Cicolidis      # a quien se asignan los issues (la asignación manda mail)
  DIAS_SIN_DISPARO: "3"

jobs:
  actualizar:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      # Código 0: publicó todo; 3: publicó, con variantes retenidas (se publica y se abre el issue); 1 o 2: no publicó.
      - name: Correr el pipeline
        id: pipeline
        continue-on-error: true
        env:
          SERIES: ${{ inputs.series }}
        run: |
          args=(actualizar --informe "$RUNNER_TEMP/informe.md" --atencion "$RUNNER_TEMP/atencion.json")
          if [ -n "$SERIES" ]; then args+=(--series "$SERIES"); fi
          set +e
          uv run python -m pipeline "${args[@]}"
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -eq 0 ] || [ "$codigo" -eq 3 ]; then exit 0; fi
          exit "$codigo"

      - name: Pruebas sobre los datos nuevos
        id: pruebas
        if: steps.pipeline.outcome == 'success'
        continue-on-error: true
        run: uv run pytest -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pruebas.txt"; exit "${PIPESTATUS[0]}"

      - name: Publicar (commit con el resumen de cambios)
        if: steps.pipeline.outcome == 'success' && steps.pruebas.outcome == 'success'
        run: |
          git add snapshots datos export
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # El informe entero: retenidas, fuentes que necesitan atención, avisos (por ejemplo, una fuente que no
          # respondió), cambios y snapshots nuevos (revisión del 07/11/2026: los avisos quedaban afuera).
          {
            echo "Datos: actualización $(date -u +%Y-%m-%d)"
            echo
            cat "$RUNNER_TEMP/informe.md"
          } > "$RUNNER_TEMP/mensaje.txt"
          git commit -F "$RUNNER_TEMP/mensaje.txt"
          # Si alguien empujó a main mientras corría el pipeline, se trae y se reintenta una vez.
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }

      - name: Abrir o comentar el issue de validación
        if: steps.pipeline.outcome == 'failure' || steps.pruebas.outcome == 'failure' || steps.pipeline.outputs.codigo == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "${{ steps.pipeline.outputs.codigo }}" = "3" ] && [ "${{ steps.pruebas.outcome }}" = "success" ]; then
              echo "La actualización del $(date -u +%Y-%m-%d) se publicó, pero algunas variantes quedaron retenidas: conservan su versión anterior, marcada como desactualizada."
            else
              echo "La actualización del $(date -u +%Y-%m-%d) no se publicó."
            fi
            echo
            echo "Corrida: $URL_RUN"
            echo
            if [ -f "$RUNNER_TEMP/informe.md" ]; then cat "$RUNNER_TEMP/informe.md"; fi
            if [ -f "$RUNNER_TEMP/pruebas.txt" ]; then
              echo; echo "## Pruebas"; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/pruebas.txt"; echo '```'
            fi
          } > "$RUNNER_TEMP/issue.md"
          gh label create validacion --color B60205 --description "Falla de validación del pipeline" 2>/dev/null || true
          abierto=$(gh issue list --label validacion --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Validación fallida en la actualización de datos" --label validacion \
              --assignee "$RESPONSABLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

      # Una fuente que no responde hace más de 7 días, o una de descarga manual sin versión nueva hace más de 3 meses:
      # un issue por fuente (SPEC 5.2). En las corridas completas se cierran los de las fuentes que se normalizaron.
      - name: Abrir o cerrar los issues de fuentes
        if: steps.pipeline.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERIES: ${{ inputs.series }}
        run: |
          archivo="$RUNNER_TEMP/atencion.json"
          [ -f "$archivo" ] || exit 0
          gh label create fuente-caida --color D93F0B --description "Una fuente no responde o necesita una descarga manual" 2>/dev/null || true
          abiertos=$(gh issue list --label fuente-caida --state open --limit 100 --json number,title)
          for fuente in $(jq -r '.atencion[].fuente' "$archivo"); do
            titulo="Fuente $fuente: necesita atención"
            if [ -z "$(jq -r --arg t "$titulo" '.[] | select(.title == $t) | .number' <<< "$abiertos")" ]; then
              motivo=$(jq -r --arg f "$fuente" '.atencion[] | select(.fuente == $f) | .motivo' "$archivo")
              printf 'La fuente `%s` %s\n\nLas variantes que la usan siguen publicadas con los datos anteriores y figuran como desactualizadas.\n\nCorrida: %s\n' \
                "$fuente" "$motivo" "$URL_RUN" > "$RUNNER_TEMP/issue-fuente.md"
              gh issue create --title "$titulo" --label fuente-caida --assignee "$RESPONSABLE" --body-file "$RUNNER_TEMP/issue-fuente.md"
            fi
          done
          # Solo una corrida completa sabe que una fuente se normalizó.
          [ -z "$SERIES" ] || exit 0
          jq -r '.[] | "\(.number)\t\(.title)"' <<< "$abiertos" | while IFS=$'\t' read -r numero titulo; do
            fuente=$(sed -E 's/^Fuente (.+): necesita atención$/\1/' <<< "$titulo")
            if ! jq -e --arg f "$fuente" '.atencion | any(.fuente == $f)' "$archivo" > /dev/null; then
              gh issue close "$numero" --comment "Se normalizó en la corrida del $(date -u +%Y-%m-%d): $URL_RUN"
            fi
          done

      - name: Controlar que el disparo diario esté llegando
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ultimo=$(gh run list --workflow actualizar.yml --event workflow_dispatch --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          limite=$(( $(date +%s) - DIAS_SIN_DISPARO * 86400 ))
          if [ -n "$ultimo" ] && [ "$(date -d "$ultimo" +%s)" -ge "$limite" ]; then
            echo "Último disparo diario: $ultimo"
            exit 0
          fi
          gh label create disparador --color FBCA04 --description "El Cron Trigger de Cloudflare no dispara el workflow" 2>/dev/null || true
          if [ -z "$(gh issue list --label disparador --state open --limit 1 --json number --jq '.[0].number // empty')" ]; then
            gh issue create --title "El disparo diario no está llegando" --label disparador --assignee "$RESPONSABLE" --body \
              "No hubo corridas por workflow_dispatch en los últimos $DIAS_SIN_DISPARO días (último: ${ultimo:-nunca}). Revisá el Cron Trigger del Worker y el secreto GITHUB_TOKEN_DISPARO (\`npx wrangler secret list\`)."
          fi

      - name: Terminar en rojo si no se publicó
        if: steps.pipeline.outcome == 'failure' || steps.pruebas.outcome == 'failure'
        run: exit 1
