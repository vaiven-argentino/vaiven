# Pruebas en cada push y en cada PR: pipeline (Python), transformaciones, cita, MCP, web y Worker (TypeScript).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with:
          enable-cache: true
      # La web enlaza la descarga completa: se genera como al publicar.
      - name: Descarga completa
        run: |
          uv sync --frozen --group descargas
          uv run python -m pipeline descargas
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vitest (transformaciones, cita, MCP, contrato y gráficos)
        run: npm test
      - name: Tipos (transformaciones, cita, MCP, astro check y Worker)
        run: npm run verificar
      - name: Armar el sitio y revisar los enlaces
        run: |
          npm run build -w @vaiven/web
          npm run enlaces -w @vaiven/web
