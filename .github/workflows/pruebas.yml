# Pruebas en cada push y en cada PR: pipeline (Python), transformaciones, web y Worker (TypeScript).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      # La web enlaza la descarga completa: se genera como al publicar.
      - name: Descarga completa
        run: |
          uv sync --frozen --group descargas
          uv run python -m pipeline descargas
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vitest (transformaciones, contrato y gráficos)
        run: npm test
      - name: Tipos (transformaciones, astro check y Worker)
        run: npm run verificar
      - name: Armar el sitio y revisar los enlaces
        run: |
          npm run build -w @vaiven/web
          npm run enlaces -w @vaiven/web
