<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaivén · en construcción</title>
  <meta name="description" content="Vaivén: series económicas argentinas, 1970–hoy. Sitio en construcción.">
  <style>
    :root { --fondo: #f7f4ec; --texto: #2b2a26; --suave: #6b665a; --acento: #6a8a3a; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #1c1d1a; --texto: #ecebe4; --suave: #a9a596; --acento: #9cbf62; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--fondo); color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }
    main { max-width: 34rem; text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 .25rem; letter-spacing: -.02em; }
    .bajada { font-size: 1.15rem; color: var(--suave); margin: 0 0 2rem; }
    .estado { display: inline-block; border: 1px solid var(--acento); color: var(--acento);
      border-radius: 999px; padding: .3rem .9rem; font-size: .95rem; }
    a { color: var(--acento); }
    footer { margin-top: 2.5rem; font-size: .9rem; color: var(--suave); }
  </style>
</head>
<body>
  <main>
    <h1>Vaivén</h1>
    <p class="bajada">Series económicas argentinas, 1970–hoy</p>
    <p class="estado">En construcción</p>
    <footer>
      <p>Seguí el avance en <a href="https://github.com/vaiven-argentino/vaiven">GitHub</a>.</p>
    </footer>
  </main>
</body>
</html>
