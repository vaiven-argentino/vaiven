# Quiebres de las series (SPEC 2.4). Tipos: cambio_de_base, cobertura, intervencion, metodologia, signo_monetario.
# `afecta` lista las variantes (<serie>.<variante>) que muestran la advertencia cuando el rango la cruza.

# ── IPC ────────────────────────────────────────────────────────────────────────
- id: q.ipc.2007-2015
  desde: 2007-01
  hasta: 2015-12
  tipo: intervencion
  descripcion: >-
    Intervención del INDEC. Desde 2016, el INDEC advierte que la información publicada para este período debe
    considerarse con reservas. Las mediciones provinciales y privadas de esos años registran inflaciones más altas.
  afecta: [ipc.oficial]
  fuente: INDEC, advertencia incluida en sus publicaciones desde 2016.

- id: q.ipc.emergencia-2016
  desde: 2015-11
  hasta: 2016-04
  tipo: intervencion
  descripcion: >-
    Emergencia estadística (Decreto 55/2016): no hay IPC oficial entre noviembre de 2015 y abril de 2016.
    En la variante oficial, las tasas de esos meses salen del IPC de la Ciudad de Buenos Aires.
  afecta: [ipc.oficial, ipc.provincias]
  fuente: Decreto 55/2016; series de datos.gob.ar.

- id: q.ipc.cobertura
  desde: 2014-01
  hasta: 2017-01
  tipo: cobertura
  descripcion: >-
    Cambios de cobertura: Gran Buenos Aires hasta 2013, Nacional Urbano (IPCNu) en 2014–2015, Gran Buenos Aires
    otra vez entre mayo y diciembre de 2016 y Nacional desde enero de 2017.
  afecta: [ipc.oficial]
  fuente: INDEC, metodologías del IPC-GBA (2008), IPCNu (2014) e IPC (2016).

- id: q.ipc.provincias
  desde: 2007-01
  hasta: 2016-04
  tipo: metodologia
  descripcion: >-
    En la variante «provincias», las tasas de 2007-01 a 2012-07 son las del IPC de San Luis y las de 2012-08 a 2016-04,
    las del IPC de la Ciudad de Buenos Aires: miden canastas y jurisdicciones distintas de las del INDEC.
  afecta: [ipc.provincias]
  fuente: Dirección Provincial de Estadística y Censos de San Luis; Instituto de Estadística y Censos de la CABA.

# ── Tipo de cambio ─────────────────────────────────────────────────────────────
- id: q.tc.mercados-desdoblados
  desde: 1971-09
  hasta: 1989-12
  tipo: metodologia
  descripcion: >-
    Mercados cambiarios desdoblados. En estos años hubo, por períodos, un mercado oficial o comercial y otro
    financiero o libre. La serie del BCRA no sigue siempre el mismo: comparada con las series diarias, coincide
    con el tipo único en 1970–1971 y 1982, con el financiero en septiembre de 1981, con el oficial en junio de 1987,
    y queda por encima del oficial en octubre de 1988 y enero de 1989 (15,11 y 17,51 australes, contra 12,36 y 13,94).
  afecta: [tc-oficial.pesos-actuales, tc-oficial.moneda-de-epoca]
  fuente: Comparación de 174.1_T_DE_CANTO_0_0_37 con las series diarias del dataset 175 de datos.gob.ar (24/10/2026).

- id: q.tc.signos-monetarios
  desde: 1983-06
  hasta: 1992-01
  tipo: signo_monetario
  descripcion: >-
    Cambios de signo monetario: peso argentino (1/6/1983, 1 = 10.000 pesos ley 18.188), austral (15/6/1985,
    1 = 1.000 pesos argentinos) y peso (1/1/1992, 1 = 10.000 australes). En la variante en moneda de cada época
    la serie salta en esas fechas.
  afecta: [tc-oficial.moneda-de-epoca]
  fuente: metadatos/signos_monetarios.yaml

# ── Reservas ───────────────────────────────────────────────────────────────────
- id: q.reservas.brutas
  desde: 1970-01
  tipo: metodologia
  descripcion: >-
    Son reservas brutas: incluyen activos que no son de libre disponibilidad, como los encajes de los depósitos
    en dólares, los swaps de monedas con otros bancos centrales y los préstamos de organismos. No hay una
    definición oficial única de reservas netas.
  afecta: [reservas.brutas]
  fuente: BCRA, series históricas de estadísticas monetarias.

# ── Desocupación ───────────────────────────────────────────────────────────────
- id: q.desocupacion.eph-2003
  desde: 2003-05
  hasta: 2003-07
  tipo: metodologia
  descripcion: >-
    Cambio de encuesta: la EPH puntual (dos ondas por año, en mayo y octubre; la fuente las fecha en mayo y
    noviembre) se reemplazó por la EPH continua (resultados trimestrales) desde el tercer trimestre de 2003.
    Las tasas no son directamente comparables y en estas variantes no se aplican coeficientes de empalme.
  afecta: [desocupacion.total-urbano, desocupacion.gba]
  fuente: INDEC (2003), «La reformulación de la Encuesta Permanente de Hogares (EPH) de Argentina».

- id: q.desocupacion.aglomerados
  desde: 1974-05
  hasta: 2003-05
  tipo: cobertura
  descripcion: >-
    La cantidad de aglomerados relevados por la EPH puntual creció a lo largo del período, así que el «total de
    aglomerados urbanos» no tiene la misma cobertura en todos los años. La EPH continua cubre hoy 31 aglomerados.
  afecta: [desocupacion.total-urbano]
  fuente: INDEC, EPH.

- id: q.desocupacion.planes-2002
  desde: 2002-05
  tipo: metodologia
  descripcion: >-
    Desde 2002, las personas que reciben planes de empleo con contraprestación laboral (como el Plan Jefes y Jefas
    de Hogar) se cuentan como ocupadas. Si se las contara como desocupadas, la tasa sería más alta.
  afecta: [desocupacion.total-urbano, desocupacion.gba]
  fuente: INDEC, EPH.

- id: q.desocupacion.emergencia-2016
  desde: 2015-10
  hasta: 2016-01
  tipo: intervencion
  descripcion: >-
    Emergencia estadística: el INDEC no publicó la EPH del cuarto trimestre de 2015 ni la del primero de 2016.
  afecta: [desocupacion.total-urbano, desocupacion.gba]
  fuente: Decreto 55/2016; series de datos.gob.ar.

# ── Importaciones y cuenta corriente ───────────────────────────────────────────
- id: q.importaciones.fob-cif-1992
  desde: 1992
  hasta: 1992
  tipo: metodologia
  descripcion: >-
    Cambio de fuente y de valuación: hasta 1991, las importaciones del balance de pagos del BCRA, que siguen el
    criterio FOB del balance de pagos (la metadata no lo declara); desde 1992, las del Intercambio Comercial
    Argentino del INDEC, a valor CIF (incluyen fletes y seguros). En 1992–2009, cuando hay datos de las dos
    fuentes, la del BCRA es entre 4,3 % y 7,2 % más baja. Los tramos se unen sin ajustar.
  afecta: [importaciones.oficial]
  fuente: Comparación de 335.1_CUENTA_CONES_IV__42 con 76.1_ITG_0_A_17 en datos.gob.ar (24/10/2026).

- id: q.cuenta-corriente.fuente-1992
  desde: 1992
  hasta: 1992
  tipo: metodologia
  descripcion: >-
    Cambio de fuente: hasta 1991, el balance de pagos histórico del BCRA; desde 1992, el balance de pagos del
    INDEC según el quinto manual del FMI (MBP5). Las dos fuentes coinciden en 1994–2001 (diferencias de hasta
    0,5 millones). Los tramos se unen sin ajustar.
  afecta: [cuenta-corriente.larga]
  fuente: Comparación de 335.1_CUENTA_COTAL__23 con 84.1_CT_0_A_8 en datos.gob.ar (24/10/2026).

- id: q.cuenta-corriente.mbp6-2006
  desde: 2006
  hasta: 2006
  tipo: metodologia
  descripcion: >-
    Cambio de manual: desde 2006, el balance de pagos del INDEC sigue el sexto manual del FMI (MBP6). En 2006–2016,
    cuando se publican los dos, el saldo según el MBP5 es entre 81 y 1.215 millones de dólares por año más alto
    (menos deficitario) que según el MBP6. Los tramos se unen sin ajustar.
  afecta: [cuenta-corriente.larga]
  fuente: Comparación de 84.1_CT_0_A_8 con 160.2_TL_CUENNTE_0_T_22 en datos.gob.ar (24/10/2026).

# ── PIB ────────────────────────────────────────────────────────────────────────
- id: q.pib.base-1960
  desde: 1970-01
  hasta: 1979-10
  tipo: cambio_de_base
  descripcion: >-
    Entre 1970 y 1980 (el crecimiento de 1980 incluido), las tasas salen de las cuentas nacionales del BCRA a
    precios de 1960. La serie a precios de
    1970 figura en la API de datos.gob.ar, pero no devuelve datos.
  afecta: [pib.retropolada]
  fuente: BCRA, cuentas nacionales 1970–1980 (datos.gob.ar, 200.1_PTOTAL_60_0_0_15).

- id: q.pib.base-1986
  desde: 1980-01
  hasta: 1980-01
  tipo: cambio_de_base
  descripcion: >-
    Cambio de base: desde 1980, los trimestres son los de las cuentas nacionales del BCRA a precios de 1986 (el
    crecimiento de 1980 es el de la base 1960; el de 1981, el de la base 1986). En los años
    en que se superpone con la base 1970 (1981–1990), las tasas anuales difieren hasta 2,6 puntos.
  afecta: [pib.retropolada]
  fuente: Comparación de 201.1_PTOTAL_LES_1970_0_22 con 255.1_PTOTAL_PM_1986_0_12 en datos.gob.ar (24/10/2026).

- id: q.pib.base-1993
  desde: 1993-01
  hasta: 1993-01
  tipo: cambio_de_base
  descripcion: >-
    Cambio de base: desde 1993, los trimestres son los de las cuentas nacionales del INDEC a precios de 1993 (el
    crecimiento de 1993 es el de la base 1986). En 1994–1996, las tasas anuales difieren de las de la base 1986 hasta 2,2 puntos.
  afecta: [pib.retropolada]
  fuente: INDEC, Oferta y demanda globales base 1993; BCRA, cuentas nacionales base 1986.

- id: q.pib.base-2004
  desde: 2004-01
  hasta: 2004-01
  tipo: cambio_de_base
  descripcion: >-
    Cambio de base: desde 2004, la serie es la de las cuentas nacionales del INDEC a precios de 2004, que da el
    nivel de toda la serie (el crecimiento de 2004 es el de la base 1993).
  afecta: [pib.retropolada]
  fuente: INDEC, Oferta y demanda globales base 2004.

- id: q.pib.revision-2008-2013
  desde: 2008-01
  hasta: 2013-10
  tipo: metodologia
  descripcion: >-
    La base 2004, que reemplazó a la base 1993 en 2014, corrige el crecimiento de 2008–2013 que daba la base 1993:
    por ejemplo, 2009 pasa de +0,9 % a −5,9 %. La serie usa la base 2004 desde 2004.
  afecta: [pib.retropolada]
  fuente: Comparación de las series anuales 2.1_OGP_1993_A_17 y 4.1_OGP_2004_A_17 en datos.gob.ar (24/10/2026).

# ── Tasa de interés pasiva ─────────────────────────────────────────────────────
- id: q.tasa.regulada-1977
  desde: 1970-01
  hasta: 1977-05
  tipo: metodologia
  descripcion: >-
    Tasas reguladas: hasta la reforma financiera de 1977, el BCRA fijaba las tasas de los depósitos, que en estos
    años quedaron muy por debajo de la inflación. Desde entonces, las tasas son libres o pactadas, salvo en algunos
    períodos de regulación posteriores.
  afecta: [tasa-pasiva.plazo-fijo]
  fuente: BCRA; Ley 21.526 de Entidades Financieras (1977).

- id: q.tasa.nominal-anual
  desde: 1970-01
  tipo: metodologia
  descripcion: >-
    Es una tasa nominal anual. Para compararla con la inflación de un mes hay que pasarla a tasa mensual; en los
    años de alta inflación la diferencia es grande (por ejemplo, junio de 1989: 1.646,9 % nominal anual).
  afecta: [tasa-pasiva.plazo-fijo, tasa-pasiva.badlar]
  fuente: BCRA, Panorama monetario y financiero («promedio mensual en porcentaje nominal anual»).

- id: q.tasa.sin-datos-1982-1984
  desde: 1982-07
  hasta: 1984-05
  tipo: cobertura
  descripcion: >-
    La fuente no tiene la tasa entre julio de 1982 y mayo de 1984, ni entre enero y marzo de 1990. Vaivén no
    completa esos meses.
  afecta: [tasa-pasiva.plazo-fijo]
  fuente: datos.gob.ar, 174.1_T_INTERD_0_0_41 y bcra_30 (24/10/2026).

# ── Base monetaria ─────────────────────────────────────────────────────────────
- id: q.base-monetaria.reforma-1982
  desde: 1982-07
  hasta: 1982-07
  tipo: metodologia
  descripcion: >-
    Reforma financiera de julio de 1982: el encaje sobre los depósitos existentes pasó al 100 % y el BCRA compró la
    cartera de préstamos de los bancos con emisión. La base monetaria casi se quintuplica en el mes (+393 %); no es
    un error de la fuente y Vaivén no lo ajusta.
  afecta: [base-monetaria.fin-de-mes]
  fuente: Rodríguez, C. A. (1986), «Un análisis estilizado de la reforma financiera de julio de 1982», CEMA, Documento de trabajo 52.

- id: q.base-monetaria.caida-2026
  desde: 2026-06
  hasta: 2026-06
  tipo: metodologia
  descripcion: >-
    En junio de 2026 la base monetaria promedio cae 56 % en un mes (de 41,4 a 18,2 billones de pesos) y se mantiene
    en ese nivel. La fuente no lo explica; puede ser un cambio de definición. A confirmar con el BCRA: Vaivén no
    ajusta ni recorta la serie.
  afecta: [base-monetaria.promedio-mensual]
  fuente: datos.gob.ar, 90.1_BMT_0_0_20 (24/10/2026).

# ── Resultado fiscal ───────────────────────────────────────────────────────────
- id: q.fiscal.cobertura-spn
  desde: 1993-01
  tipo: cobertura
  descripcion: >-
    Cubre el Sector Público Nacional (administración nacional, empresas y fondos fiduciarios y otros entes): no
    incluye a las provincias ni a los municipios, ni el resultado del BCRA (cuasifiscal).
  afecta: [resultado-fiscal.primario, resultado-fiscal.financiero]
  fuente: Secretaría de Hacienda, esquema Ahorro-Inversión-Financiamiento del Sector Público Nacional.

- id: q.fiscal.sin-privatizaciones
  desde: 1993-01
  hasta: 2006-12
  tipo: metodologia
  descripcion: >-
    En 1993–2006, el resultado financiero no incluye los ingresos por privatizaciones: la serie que los incluye
    figura en la API de datos.gob.ar, pero no devuelve datos.
  afecta: [resultado-fiscal.financiero]
  fuente: datos.gob.ar, 379.7_RESULTADO_006__43_20 y 379.7_RESULTADO_006__23_14 (24/10/2026).

- id: q.fiscal.metodologia-2007
  desde: 2007-01
  hasta: 2007-01
  tipo: metodologia
  descripcion: >-
    Cambio de metodología: desde 2007, Hacienda publica el esquema con la metodología 2007–2014, en una serie
    distinta de la de 1993–2006. Los bloques se unen sin ajustar y no son estrictamente comparables.
  afecta: [resultado-fiscal.primario, resultado-fiscal.financiero]
  fuente: Secretaría de Hacienda (datos.gob.ar, dataset 379).

- id: q.fiscal.metodologia-2015
  desde: 2015-01
  hasta: 2015-01
  tipo: metodologia
  descripcion: >-
    Cambio de metodología: desde 2015, la serie sigue la metodología de 2017, que Hacienda aplicó hacia atrás
    hasta 2015. Se une sin ajustar con el bloque 2007–2014.
  afecta: [resultado-fiscal.primario, resultado-fiscal.financiero]
  fuente: Secretaría de Hacienda (datos.gob.ar, dataset 379).

# ── Tipo de cambio real multilateral ───────────────────────────────────────────
- id: q.tcr.base-1997
  desde: 1997-02
  hasta: 1997-02
  tipo: cambio_de_base
  descripcion: >-
    Cambio de base y de ponderadores: hasta enero de 1997, las tasas son las del índice base diciembre 2001; desde
    febrero de 1997, las del índice base 17-12-2015. Donde se superponen (1997–2014), sus tasas mensuales difieren
    0,8 puntos en promedio, con un máximo de 3,4 puntos (mayo de 2002).
  afecta: [tcr-multilateral.bcra]
  fuente: Comparación de 115.3_TCRM_0_M_29 con 116.3_TCRMA_0_M_36 en datos.gob.ar (24/10/2026).

- id: q.tcr.ipc-2007-2015
  desde: 2007-01
  hasta: 2015-12
  tipo: intervencion
  descripcion: >-
    Entre 2007 y 2015, el índice depende de qué inflación argentina se use para deflactar, y la oficial del INDEC
    de esos años está en duda (ver el IPC). La variante recalculada con un IPC alternativo queda pendiente.
  afecta: [tcr-multilateral.bcra, tcr-multilateral.bruegel]
  fuente: INDEC, advertencia sobre el IPC 2007–2015.

- id: q.tcr.bruegel
  desde: 1970-01
  tipo: metodologia
  descripcion: >-
    Índice de Bruegel (Darvas): otra canasta (51 socios), otros ponderadores y otros IPC que el del BCRA, dado
    vuelta para que un aumento sea depreciación. No se empalma con el del BCRA. En 1997–2024 sus tasas anuales
    siguen de cerca a las del BCRA (correlación de 0,98), pero en algunos años difieren mucho: en 1999 da +2,1 %
    y el BCRA, −11,0 %.
  afecta: [tcr-multilateral.bruegel]
  fuente: Comparación de REER_51_AR (Bruegel, versión del 11/10/2026) con 116.3_TCRMA_0_M_36 (24/10/2026).

# ── Auxiliares ─────────────────────────────────────────────────────────────────
- id: q.pib-nominal.retropolado
  desde: 1970
  hasta: 2004
  tipo: cambio_de_base
  descripcion: >-
    Hasta 2004, el nivel del PIB nominal está retropolado desde la base 2004 con las tasas de la base 1993 y, antes
    de 1994, con las del Banco Mundial. No coincide con el PIB nominal publicado en cada base: la base 2004 da, en
    2004, un PIB 8 % mayor que la base 1993, y la diferencia llega a 22 % en 2012.
  afecta: [pib-nominal.anual, pib-nominal.trimestral]
  fuente: Comparación de 2.3_OGP_1993_A_17 con 4.3_OGP_2004_A_17 en datos.gob.ar (24/10/2026).

- id: q.pib-dolares.tipo-de-cambio
  desde: 1970
  tipo: metodologia
  descripcion: >-
    El tipo de cambio es el promedio de los valores de fin de mes de la serie oficial del BCRA (CAM-01), no el
    promedio diario. En los años de mercados desdoblados o de cepo, el PIB en dólares depende mucho de qué tipo de
    cambio se use.
  afecta: [pib-dolares.anual, pib-dolares.trimestral]
  fuente: Vaivén (método de la variante).

- id: q.ipc-eeuu.octubre-2025
  desde: 2025-10
  hasta: 2025-10
  tipo: cobertura
  descripcion: >-
    El BLS no relevó precios en octubre de 2025 por el cierre del gobierno federal, así que ese mes no tiene dato.
  afecta: [ipc-eeuu.ocde]
  fuente: BLS, «2025 Federal Government Shutdown Impact on the Consumer Price Index».
