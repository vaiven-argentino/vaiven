  - f.hacienda.spa-devengado-financiero-1977-1986
  - f.hacienda.spa-devengado-financiero-1987-1989
  - f.hacienda.spa-devengado-financiero-1990-1992
  - f.hacienda.spa-devengado-primario-1961-1976
  - f.hacienda.spa-devengado-primario-1977-1986
  - f.hacienda.spa-devengado-primario-1987-1989
  - f.hacienda.spa-devengado-primario-1990-1992
  - f.hacienda.spn-primario-1993-2006
  - f.hacienda.spn-primario-2007-2014
  - f.hacienda.spn-primario-2017
  - f.hacienda.spn-financiero-1993-2006
  - f.hacienda.spn-financiero-2007-2014
  - f.hacienda.spn-financiero-2017
