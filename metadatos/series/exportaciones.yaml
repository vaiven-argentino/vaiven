id: exportaciones
codigo: EXT-01
nombre: Exportaciones
bloque: Sector externo
prioridad: A
definicion: Exportaciones de bienes FOB, según el Intercambio Comercial Argentino del INDEC.
unidad: millones de US$ corrientes
tipo: flujo
agregacion: suma
frecuencia: anual
moneda: dolares
cobertura: {desde: 1970, hasta: hoy}
variante_por_defecto: oficial
variantes:
  - id: oficial
    nombre: Oficial INDEC, anual
    estado: publicada
    empalme: yuxtaponer
    metodo: Serie anual del Intercambio Comercial Argentino (INDEC), sin cambios.
    tramos:
      - {fuente: f.indec.ica-exportaciones-anual, desde: 1970}
    coherencia:
      # La suma de los meses tiene que dar el total anual publicado.
      - {mensual: f.indec.ica-exportaciones-mensual, anual: f.indec.ica-exportaciones-anual, agregacion: suma, tolerancia_pct: 0.01}
  - id: mensual
    nombre: Oficial INDEC, mensual (desde 1992)
    estado: publicada
    frecuencia: mensual
    empalme: yuxtaponer
    metodo: Serie mensual del Intercambio Comercial Argentino (INDEC), sin cambios. Empieza en enero de 1992.
    tramos:
      - {fuente: f.indec.ica-exportaciones-mensual, desde: 1992-01}
    validacion:
      var_min: -70
      var_max: 150
  - id: dolares-constantes
    nombre: En dólares constantes
    estado: pendiente
    nota: Pendiente hasta ubicar un índice de precios de las exportaciones abierto (no está en la API de datos.gob.ar).
    empalme: yuxtaponer
    metodo: Pendiente.
    tramos:
      - {fuente: f.indec.ica-exportaciones-anual, desde: 1970}
validacion:
  min: 0
  max: 300000
  var_min: -60
  var_max: 100
  umbral_revision_pct: 0.5
quiebres: []
transformaciones: [var_interanual, base_100, frecuencia, pct_pib]
fuentes: [f.indec.ica-exportaciones-anual, f.indec.ica-exportaciones-mensual]
bibliografia: [CENDA2010-G5]
licencia_derivado: CC-BY-4.0
