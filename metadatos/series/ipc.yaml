id: ipc
codigo: PRE-01
nombre: Inflación minorista (IPC)
bloque: Precios
prioridad: A
definicion: Índice de precios al consumidor, nivel general.
unidad: índice dic. 2016 = 100
tipo: precio
agregacion: promedio
frecuencia: mensual
escala_log: true
cobertura: {desde: 1970-01, hasta: hoy}
variante_por_defecto: oficial
variantes:
  - id: oficial
    nombre: Oficial INDEC, sin corregir
    estado: publicada
    empalme: encadenar_tasas
    metodo: >-
      Encadenamiento de tasas de variación mensual entre los tramos oficiales del INDEC, retropolado desde el IPC
      Nacional base diciembre 2016. Desde febrero de 1993 se usa el IPC-GBA base 2008 en lugar del IPC histórico:
      dan las mismas tasas salvo en mayo y junio de 2004, donde el IPC-GBA coincide con lo publicado por el INDEC
      en su momento (0,7 % y 0,6 %). Entre noviembre de 2015 y abril de 2016, sin IPC oficial por la emergencia
      estadística, se usan las tasas del IPC de la Ciudad de Buenos Aires.
    tramos:
      - {fuente: f.indec.ipc-historico-1943-2008, desde: 1970-01, hasta: 1993-01}
      - {fuente: f.indec.ipc-gba-base-2008, desde: 1993-02, hasta: 2013-12}
      - {fuente: f.indec.ipc-nu-base-2013, desde: 2014-01, hasta: 2015-10}
      - {fuente: f.caba.ipcba-base-2011-2012, desde: 2015-11, hasta: 2016-04, rol: puente}
      - {fuente: f.indec.ipc-gba-base-2016, desde: 2016-05, hasta: 2016-12}
      - {fuente: f.indec.ipc-nacional-base-2016, desde: 2017-01}
    advertencias: [q.ipc.2007-2015, q.ipc.emergencia-2016, q.ipc.cobertura]
    continuidad:
      # En la superposición, el IPC histórico y el IPC-GBA base 2008 tienen que dar las mismas tasas.
      # Excepción documentada: mayo y junio de 2004 (diferencias de ±0,13 p. p.; ver `metodo`).
      - {a: f.indec.ipc-historico-1943-2008, b: f.indec.ipc-gba-base-2008, desde: 1993-02, hasta: 2008-04, en: tasas,
         tolerancia: 0.01, excepciones: [2004-05, 2004-06]}
  - id: provincias
    nombre: Provincias (San Luis y Ciudad de Buenos Aires) en 2007–2016
    estado: publicada
    empalme: encadenar_tasas
    metodo: >-
      Igual que la variante oficial, salvo entre enero de 2007 y abril de 2016: hasta julio de 2012 se usan las
      tasas del IPC de San Luis y desde agosto de 2012, las del IPC de la Ciudad de Buenos Aires.
    tramos:
      - {fuente: f.indec.ipc-historico-1943-2008, desde: 1970-01, hasta: 1993-01}
      - {fuente: f.indec.ipc-gba-base-2008, desde: 1993-02, hasta: 2006-12}
      - {fuente: f.sanluis.ipc-base-2003, desde: 2007-01, hasta: 2012-07}
      - {fuente: f.caba.ipcba-base-2011-2012, desde: 2012-08, hasta: 2016-04}
      - {fuente: f.indec.ipc-gba-base-2016, desde: 2016-05, hasta: 2016-12}
      - {fuente: f.indec.ipc-nacional-base-2016, desde: 2017-01}
    advertencias: [q.ipc.provincias, q.ipc.emergencia-2016]
  - id: cavallo-bertolotto
    nombre: Cavallo–Bertolotto (San Luis + PriceStats)
    estado: pendiente_licencia
    nota: Se publica cuando los autores confirmen que se puede redistribuir con atribución.
    empalme: encadenar_tasas
    metodo: >-
      Igual que la variante oficial, salvo entre enero de 2007 y abril de 2016, donde se usan las tasas del índice
      de Cavallo y Bertolotto (2016).
    tramos:
      - {fuente: f.indec.ipc-historico-1943-2008, desde: 1970-01, hasta: 1993-01}
      - {fuente: f.indec.ipc-gba-base-2008, desde: 1993-02, hasta: 2006-12}
      - {fuente: f.cavallo-bertolotto.ipc, desde: 2007-01, hasta: 2016-04}
      - {fuente: f.indec.ipc-gba-base-2016, desde: 2016-05, hasta: 2016-12}
      - {fuente: f.indec.ipc-nacional-base-2016, desde: 2017-01}
    advertencias: [q.ipc.emergencia-2016]
validacion:
  min: 0
  var_min: -10       # enero de 1974: −5,72 % en el IPC histórico del INDEC
  var_max: 210        # julio de 1989: 196,6 %
  umbral_revision_pct: 0.1
quiebres: [q.ipc.2007-2015, q.ipc.emergencia-2016, q.ipc.cobertura, q.ipc.provincias]
transformaciones: [var_mensual, var_interanual, var_dic_dic, acumulada_anio, base_100, frecuencia]
fuentes:
  - f.indec.ipc-historico-1943-2008
  - f.indec.ipc-gba-base-2008
  - f.indec.ipc-nu-base-2013
  - f.indec.ipc-gba-base-2016
  - f.indec.ipc-nacional-base-2016
  - f.caba.ipcba-base-2011-2012
  - f.sanluis.ipc-base-2003
bibliografia: [DF2013-G2, DF1990-C1]
licencia_derivado: CC-BY-4.0
