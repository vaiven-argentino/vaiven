id: pib
codigo: ACT-01
nombre: PIB real
bloque: Actividad
prioridad: A
definicion: >-
  Producto interno bruto a precios constantes, trimestral. Los valores van a ritmo anual, como los publica el
  INDEC: el promedio de los cuatro trimestres es el PIB del año.
unidad: millones de pesos de 2004, a ritmo anual
tipo: flujo
agregacion: promedio
frecuencia: trimestral
cobertura: {desde: 1970-01, hasta: hoy}
variante_por_defecto: retropolada
vista_inicial: {transformacion: var_interanual}
variantes:
  - id: retropolada
    nombre: Retropolada desde la base 2004 (tasas de variación)
    estado: publicada
    empalme: encadenar_tasas
    enlace: anual
    metodo: >-
      Retropolación por tasas de variación desde la base 2004 del INDEC: base 1960 del BCRA para 1970–1979, base
      1986 del BCRA para 1980–1992, base 1993 del INDEC para 1993–2003 y base 2004 desde 2004. Cada tramo conserva
      sus tasas. El enlace se hace en el primer año de cada base nueva (1980, 1993 y 2004): el tramo anterior se
      reescala con el cociente entre los totales de ese año en las dos bases, así que el crecimiento del año de
      enlace es el de la base anterior. Enlazar en un solo trimestre mezclaría la estacionalidad distinta de cada
      base. El nivel es el de la base 2004.
    tramos:
      - {fuente: f.bcra.pib-base-1960, desde: 1970-01, hasta: 1979-10}
      - {fuente: f.bcra.pib-base-1986, desde: 1980-01, hasta: 1992-10}
      - {fuente: f.indec.pib-base-1993, desde: 1993-01, hasta: 2003-10}
      - {fuente: f.indec.pib-base-2004, desde: 2004-01}
    advertencias: [q.pib.base-1960, q.pib.base-1986, q.pib.base-1993, q.pib.base-2004, q.pib.revision-2008-2013]
  - id: niveles
    nombre: Empalme por niveles
    estado: pendiente
    nota: Pendiente. Es la alternativa al empalme por tasas que menciona el catálogo; el método falta acordarlo.
    empalme: yuxtaponer
    metodo: Pendiente.
    tramos:
      - {fuente: f.indec.pib-base-2004, desde: 2004-01}
validacion:
  min: 0
  var_min: -20
  var_max: 20
  umbral_revision_pct: 0.5
quiebres: [q.pib.base-1960, q.pib.base-1986, q.pib.base-1993, q.pib.base-2004, q.pib.revision-2008-2013]
transformaciones: [var_interanual, base_100, frecuencia, media_movil]
fuentes: [f.bcra.pib-base-1960, f.bcra.pib-base-1986, f.indec.pib-base-1993, f.indec.pib-base-2004]
bibliografia: [DF1990-C1, FF1990-C1, OS2006-G4, DLB1993-C7, DLB1993-C9, DLB1993-A1, RAP2005-G3.1, RAP2005-C3.1, CENDA2010-G1, CENDA2010-C1, DF2013-C1, DF2013-G1, CENDA2004-G3, GAM2015-T3]
licencia_derivado: CC-BY-4.0
