id: base-monetaria
codigo: MON-01
nombre: Base monetaria
bloque: Monetario
prioridad: A
definicion: >-
  Base monetaria (circulación monetaria más los depósitos de los bancos en el BCRA), en millones de pesos
  actuales: los valores anteriores a 1992 están convertidos con las equivalencias de los signos monetarios.
unidad: millones de pesos actuales
tipo: stock
agregacion: fin_de_periodo
frecuencia: mensual
moneda: pesos_actuales
escala_log: true
cobertura: {desde: 1970-01, hasta: hoy}
variante_por_defecto: fin-de-mes
unidades_medida: {real: 'millones de pesos de {base}', en_dolares: millones de US$}
variantes:
  - id: fin-de-mes
    nombre: Saldo de fin de mes (desde 1970)
    estado: publicada
    empalme: yuxtaponer
    metodo: >-
      Serie histórica del BCRA, saldo de fin de mes en pesos equivalentes (pesos actuales), sin cambios. Llega con el
      atraso de la copia de datos.gob.ar.
    tramos:
      - {fuente: f.bcra.base-monetaria-mensual, desde: 1970-01}
    advertencias: [q.base-monetaria.reforma-1982]
    validacion:
      var_excepciones: [1982-07]
  - id: promedio-mensual
    nombre: Promedio mensual (desde 2003)
    estado: publicada
    agregacion: promedio
    empalme: yuxtaponer
    metodo: Base monetaria total en promedio de saldos diarios de cada mes, según el BCRA, sin cambios. Empieza en enero de 2003.
    tramos:
      - {fuente: f.bcra.base-monetaria-promedio, desde: 2003-01}
    advertencias: [q.base-monetaria.caida-2026]
    validacion:
      var_excepciones: [2026-06]
validacion:
  min: 0
  var_min: -40
  var_max: 200
  umbral_revision_pct: 0.5
quiebres: [q.base-monetaria.reforma-1982, q.base-monetaria.caida-2026]
transformaciones: [var_mensual, var_interanual, base_100, frecuencia, media_movil, real, en_dolares, pct_pib]
fuentes: [f.bcra.base-monetaria-mensual, f.bcra.base-monetaria-promedio]
bibliografia: [DLB1993-A13, RAP2005-G3.8, RAP2005-C3.2, DF2013-C3, DF2013-G9]
licencia_derivado: CC-BY-4.0
