# ── Tipo de cambio (CAM-01) y reservas (EXT-06) ────────────────────────────────
# Copias de datos.gob.ar (CC BY 4.0). La API del BCRA no se usa por ahora: su aviso legal no permite
# el uso comercial sin autorización, lo que no es compatible con CC BY 4.0 (decisión del 24/10/2026).
- id: f.bcra.tc-historico-mensual
  organismo: BCRA (publicado por la Subsecretaría de Programación Macroeconómica)
  nombre: Series históricas de estadísticas monetarias. Tipo de cambio en pesos equivalentes
  api: datos.gob.ar
  id_api: 174.1_T_DE_CATES_0_0_32
  url: https://apis.datos.gob.ar/series/api/series/?ids=174.1_T_DE_CATES_0_0_32
  licencia: CC-BY-4.0
  frecuencia: mensual
  unidad: pesos actuales por dólar
  cobertura: {desde: 1940-01, hasta: hoy}
  verificado: 2026-10-24
  nota: >-
    Valor de fin de mes: coincide con el último dato del mes de las series diarias de «Tipos de Cambio Históricos»
    (dataset 175). No sigue un único mercado en los períodos de desdoblamiento (ver q.tc.mercados-desdoblados).
    Se usa la versión en pesos equivalentes (CATES) y no la «moneda de cada momento» (174.1_T_DE_CANTO_0_0_37),
    porque esta última cambia de unidad en enero de 1983, enero de 1985 y enero de 1990, y no en las fechas de
    los cambios de signo monetario (junio de 1983, junio de 1985 y enero de 1992).

