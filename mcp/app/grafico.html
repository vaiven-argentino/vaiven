<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaivén · gráfico</title>
<!-- La interfaz de especificacion_grafico en Claude (ui://vaiven/grafico, SPEC 7.4). El HTML es mínimo: el script se
     pide al dominio de Vaivén (assets estáticos del Worker, sin CPU), declarado en _meta.ui.csp. `armar-app.mjs` pone el
     nombre del script (con el hash de su contenido) y el servidor, el dominio (__ORIGEN__). -->
<style>
  :root {
    color-scheme: light;
    --fondo: #faf7f0; --superficie: #f2ecdf; --texto: #22201b; --secundario: #575045; --borde: #7d7466; --linea: #ddd5c4;
    --acento: #9a4422;
    --sans: "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fondo: #17140f; --superficie: #221d17; --texto: #efe9de; --secundario: #bdb3a3; --borde: #857b6c; --linea: #3a332a;
    --acento: #ee9a7a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.5 var(--sans); }
  .app { padding: 10px 12px 12px; }
  .cabeza { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: flex-start; justify-content: space-between; }
  h1 { font-size: 17px; margin: 0; line-height: 1.3; }
  .series { margin: 4px 0 0; font-size: 13px; }
  .series li { margin: 1px 0; }
  .series .trazo { display: inline-block; width: 22px; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
  .series.una .trazo { display: none; }
  .secundario { color: var(--secundario); font-size: 12.5px; margin: 2px 0 0; }
  .acciones { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13px; min-height: 36px; padding: 4px 12px; border: 1px solid var(--borde); border-radius: 6px; background: transparent; color: var(--texto); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--superficie); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  details { margin-top: 8px; border-top: 1px solid var(--linea); padding-top: 6px; }
  summary { cursor: pointer; color: var(--secundario); font-size: 13px; }
  .controles { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; margin-top: 8px; }
  .controles label { display: grid; gap: 2px; font-size: 12.5px; color: var(--secundario); }
  .controles label.casilla { display: flex; gap: 6px; align-items: center; color: var(--texto); min-height: 32px; }
  .controles input[type="checkbox"] { width: 18px; height: 18px; }
  .controles input[type="text"] { width: 7.5em; }
  .periodo { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; border: 1px solid var(--linea); border-radius: 6px; padding: 4px 10px 8px; margin: 0; flex-basis: 100%; }
  .periodo legend { font-size: 12.5px; color: var(--secundario); padding: 0 4px; }
  .periodo #ayuda-periodo { align-self: center; font-size: 12.5px; }
  #nota-simbolos { margin: 16px 0 0; font-size: 12.5px; }
  input, select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--borde); border-radius: 6px; background: var(--fondo); color: var(--texto); }
  .estado { min-height: 1.2em; margin: 6px 0 0; font-size: 13px; color: var(--secundario); }
  .estado[data-tipo="error"] { color: var(--acento); font-weight: 600; }
  .grafico { width: 100%; margin-top: 4px; overflow-x: auto; }
  .grafico svg { max-width: 100%; height: auto; }
  ul { margin: 6px 0 0; padding-left: 0; list-style: none; font-size: 13px; }
  li { margin: 3px 0; overflow-wrap: anywhere; }
  .marca { font-weight: 600; margin-right: 4px; }
  #vg-tooltip-element.vg-tooltip.custom-theme {
    background: var(--superficie); color: var(--texto); border: 1px solid var(--borde); border-radius: 6px;
    font-family: var(--sans); font-size: 12px; box-shadow: none; padding: 6px 10px;
  }
  #vg-tooltip-element.custom-theme td.key { color: var(--secundario); }
  /* Un evento por renglón y sin cortar (S1, sonda 5 de la 4e): vega-tooltip limita el valor a 200 px con elipsis. El ancho
     no pasa del de la ventana: si el cartel no entra, vega-tooltip no lo muestra (en 390 px). */
  #vg-tooltip-element.custom-theme td.value { white-space: pre-line; max-width: min(420px, calc(100vw - 110px)); overflow: visible; text-overflow: clip; }
</style>
</head>
<body>
<main class="app">
  <header class="cabeza">
    <div>
      <h1 id="titulo">Vaivén · gráfico</h1>
      <p class="secundario" id="subtitulo"></p>
      <ul class="series" id="lista-series"></ul>
    </div>
    <div class="acciones">
      <button type="button" id="abrir" disabled>Abrir en el explorador</button>
      <button type="button" id="bajar-png" disabled>PNG</button>
      <button type="button" id="bajar-svg" disabled>SVG</button>
      <button type="button" id="pantalla" hidden>Pantalla completa</button>
    </div>
  </header>
  <details id="caja-controles">
    <summary>Cambiar el gráfico</summary>
    <form class="controles" id="controles">
      <!-- «Desde» y «Hasta» en un grupo «Período», con la ayuda en el mismo renglón (S3, sonda 5 de la 4e). -->
      <fieldset class="periodo">
        <legend>Período</legend>
        <label>Desde <input type="text" id="desde" inputmode="numeric" placeholder="AAAA o AAAA-MM" aria-describedby="ayuda-periodo"></label>
        <label>Hasta <input type="text" id="hasta" inputmode="numeric" placeholder="AAAA o AAAA-MM" aria-describedby="ayuda-periodo"></label>
        <span class="secundario" id="ayuda-periodo">Un año (2001) o un mes (2001-12). Vacío: toda la serie.</span>
      </fieldset>
      <span id="transformaciones" class="controles"></span>
      <label>Sombreado <select id="sombreado"><option value="">Sin sombreado</option></select></label>
      <label class="casilla"><input type="checkbox" id="eventos"> Eventos</label>
      <label class="casilla" id="campo-leyenda" hidden><input type="checkbox" id="leyenda"> Leyenda arriba</label>
      <label class="casilla" id="campo-paneles" hidden><input type="checkbox" id="paneles"> <span id="texto-paneles">En paneles</span></label>
    </form>
  </details>
  <p class="estado" id="estado" role="status" aria-live="polite">Esperando el gráfico…</p>
  <div class="grafico" id="grafico"></div>
  <p class="secundario" id="nota-simbolos" hidden></p>
  <details id="caja-avisos" hidden>
    <summary>Advertencias (<span id="cantidad-avisos">0</span>)</summary>
    <ul id="avisos"></ul>
  </details>
  <details id="caja-eventos" hidden>
    <summary>Eventos (<span id="cantidad-eventos">0</span>)</summary>
    <ul id="lista-eventos"></ul>
  </details>
  <details id="caja-citas" hidden>
    <summary>Fuentes y cita</summary>
    <ul id="citas"></ul>
  </details>
</main>
<script>window.__vaivenOrigen = "__ORIGEN__";</script>
<script type="module" src="__ORIGEN__/mcp-app/__SCRIPT__"></script>
</body>
</html>
